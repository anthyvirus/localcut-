name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install ffmpeg -y --no-progress --force
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Start-Sleep -Seconds 15
          }
          ffmpeg -version | Select-Object -First 1
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: "1" }
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  package-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Package installer
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --publish never 2>&1 | tee builder.log || {
            msg=$(tail -n 40 builder.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=electron-builder failed::$msg"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalCut-windows
          path: |
            release/*.exe
